services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Str0ngPa55word2026}
      MSSQL_PID: Developer

    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      # API стартує лише після того, як SQL Server реально приймає запити,
      # інакше міграції впадуть на старті.
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: ConferenceBooking.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=db;Database=ConferenceBooking;User Id=sa;Password=${DB_PASSWORD:-Str0ngPa55word2026};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY:-docker-compose-dev-key-at-least-32-characters-long}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@local.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin12345}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql-data:
